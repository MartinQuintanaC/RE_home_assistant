<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Assistant - Panel de Dispositivos</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-sky-500 selection:text-white">

  <!-- BARRA SUPERIOR -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2.5 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 text-white shadow-lg shadow-sky-500/20">
          <i data-lucide="layout-grid" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-lg leading-tight tracking-tight">Panel por Dispositivos</h1>
            <span class="px-2 py-0.5 text-[10px] font-semibold tracking-wider uppercase rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">
              Entidades Habilitadas
            </span>
          </div>
          <p class="text-xs text-slate-400" id="header-subtitle">Cargando dispositivos de Home Assistant...</p>
        </div>
      </div>

      <!-- Acciones de cabecera -->
      <div class="flex items-center gap-3">
        <button 
          id="btn-sync" 
          onclick="syncWithHA()" 
          title="Sincronizar cambios de entidades desde Home Assistant" 
          class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs text-slate-300 border border-slate-700/60 transition-all cursor-pointer active:scale-95"
        >
          <i id="sync-icon" data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Sincronizar</span>
        </button>

        <div id="connection-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-950/80 text-emerald-400 border border-emerald-800/60 shadow-sm transition-all duration-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span id="connection-text">En Vivo</span>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO: APARTADOS POR DISPOSITIVO -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
    <div id="devices-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Los apartados de dispositivos se generan aquí dinámicamente -->
    </div>

    <!-- NOTIFICACIÓN TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-3 rounded-xl bg-slate-800/90 border border-slate-700 text-slate-200 text-sm shadow-2xl backdrop-blur transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 pointer-events-none z-50">
      <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
      <span id="toast-msg">Actualizado</span>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
